name: Build and Push on PR Merge

"on":
  pull_request:
    types: [closed]

permissions:
  pull-requests: write
  packages: write

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract Release Version
        id: pkg
        if: startsWith(github.event.pull_request.head.ref, 'release-please--')
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Docker meta for GHCR
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/oddwarrior/panasonic-ac-backend
          tags: |
            type=raw,value=${{ steps.vars.outputs.short_sha }}
            type=ref,event=pr

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.pkg.outputs.version != '' && format('oddwarrior/panasonic-ac-backend:{0}', steps.pkg.outputs.version) || '' }}
            ${{ steps.pkg.outputs.version != '' && 'oddwarrior/panasonic-ac-backend:latest' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/oddwarrior/panasonic-ac-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/oddwarrior/panasonic-ac-backend:buildcache,mode=max

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const version = "${{ steps.pkg.outputs.version }}";
            let tags = `${{ steps.meta.outputs.tags }}`;
            
            if (version !== "") {
              tags += `\noddwarrior/panasonic-ac-backend:${version}\noddwarrior/panasonic-ac-backend:latest`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Docker Image Published!**\n\nThe following tags have been built and pushed:\n\`\`\`text\n${tags}\n\`\`\``
            })
